schema: figure-library.personal-module.v1
moduleId: ternary-plot
title: 三元相图
titleEn: ternary plot
description: 使用 ggtern 包绘制三元相图，展示三个组分（A/B/C）的组成关系。按四个分组（T/D/L/K）着色，点大小反映平均值。
application: |-
  - **组成数据分析。** 适用于微生物群落、地球化学、材料科学等领域的三元组成数据可视化。
  - **多组比较。** 通过颜色映射分组变量，直观比较不同组在三维空间中的分布差异。
  - **丰度可视化。** 点大小编码第三个维度（如平均丰度），增强信息密度。
scientificQuestion: 三个组分比例关系下，不同分组样本如何分布？
dataProfile: 使用内嵌示例数据，包含80行OTU物种在A/B/C三个组分下的百分比数据。用户可替换为自身数据。
